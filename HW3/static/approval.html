<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Согласование командировки</title>
<style>
body{font-family:system-ui,sans-serif;background:#f4f7fb;color:#172033;margin:0}.card{max-width:760px;margin:40px auto;padding:28px;background:#fff;border:1px solid #e2e8f0;border-radius:16px;box-shadow:0 5px 20px #182b4a0a}h1{margin-top:0;font-size:26px}.muted{color:#667085}.decision{border:1px solid #dce4f0;border-radius:10px;padding:14px;margin:10px 0}.actions{display:flex;gap:10px;margin-top:20px}button{border:0;border-radius:9px;padding:11px 18px;font:inherit;cursor:pointer}.approve{background:#16803c;color:#fff}.reject{background:#fee4e2;color:#b42318}.status{margin-top:16px;padding:12px;border-radius:9px;background:#eef4ff}.error{background:#fff0ee;color:#b42318}.back{display:inline-block;margin-top:18px;color:#2855c5}
</style>
</head>
<body><main class="card"><h1>Согласование командировки</h1><p id="case" class="muted">Загрузка кейса…</p><section id="decisions"></section><label>Комментарий (необязательно)<textarea id="comment" rows="4" style="width:100%;margin-top:8px;padding:10px;border:1px solid #ccd5e3;border-radius:8px;font:inherit"></textarea></label><div class="actions"><button class="approve" id="approve">Согласовать</button><button class="reject" id="reject">Отклонить</button></div><div id="status"></div><a class="back" id="back" href="/">Вернуться в оформление</a></main>
<script>
const caseId=new URLSearchParams(location.search).get('case_id');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,options={}){const response=await fetch(path,{headers:{'Content-Type':'application/json',...(options.headers||{})},...options});const data=await response.json();if(!response.ok)throw new Error(data.error||data.message||'Ошибка');return data}
function showStatus(text,error=false){const node=document.getElementById('status');node.className=error?'status error':'status';node.textContent=text}
async function load(){if(!caseId){showStatus('В URL отсутствует case_id',true);return}document.getElementById('back').href=`/?case_id=${encodeURIComponent(caseId)}`;try{const data=await api(`/api/trips/${encodeURIComponent(caseId)}`);document.getElementById('case').innerHTML=`Кейс <b>${esc(data.case_id)}</b><br>Статус: <b>${esc(data.status)}</b>`;document.getElementById('decisions').innerHTML=(data.policy_decisions||[]).map(d=>`<div class="decision"><b>${esc(d.rule_code)}</b><p>${esc(d.explanation)}</p><p class="muted">Основание: ${esc(d.citations?.join(', '))}</p></div>`).join('')||'<p class="muted">Решения политики отсутствуют.</p>'}catch(e){showStatus(e.message,true)}}
async function decide(decision){try{const data=await api(`/api/trips/${encodeURIComponent(caseId)}/approval`,{method:'POST',body:JSON.stringify({decision,comment:document.getElementById('comment').value})});showStatus(`Решение обработано. Новый статус: ${data.status}`);document.getElementById('approve').disabled=true;document.getElementById('reject').disabled=true}catch(e){showStatus(e.message,true)}}
document.getElementById('approve').onclick=()=>decide('approved');document.getElementById('reject').onclick=()=>decide('rejected');load();
</script></body></html>
